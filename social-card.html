<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{SOCIAL_META}}
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111d; color: #e8f6ff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { width: min(720px, calc(100% - 48px)); padding: 36px; border: 1px solid #245271; border-radius: 16px; background: linear-gradient(145deg, #0b1d31, #07111d); box-shadow: 0 16px 48px #0008; }
  h1 { margin: 0 0 12px; color: #ffd36b; font-size: clamp(1.5rem, 5vw, 2.35rem); letter-spacing: .07em; }
  p { margin: 0; color: #c7dfed; line-height: 1.8; }
</style>
</head>
<body>
<main>
  <h1>STAR FOX — SKYBLAZER SQUADRON</h1>
  <p>4つの戦闘ゾーン、16 Wave、6ボスに挑む3Dレールシューティング。</p>
</main>
</body>
</html>
